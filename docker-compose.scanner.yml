# Deploy on an isolated private network. Do not publish port 3310.
services:
  clamd:
    image: clamav/clamav:stable
    restart: unless-stopped
    volumes:
      - clamav-db:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --version"]
      interval: 30s
      timeout: 10s
      retries: 10
  scanner-worker:
    build:
      context: .
      dockerfile: docker/scanner.Dockerfile
    restart: unless-stopped
    depends_on:
      clamd:
        condition: service_healthy
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      CLAMD_HOST: clamd
      CLAMD_PORT: "3310"
      SCAN_BATCH_SIZE: "10"
      SCAN_INTERVAL_MS: "60000"
volumes:
  clamav-db:
