# This daemon is reachable only through the Render private network.
TCPSocket 3310
TCPAddr 0.0.0.0
Foreground yes

# The application rejects uploads over 10 MiB. Keep the protocol allowance
# slightly above that to make its bound explicit without admitting large input.
StreamMaxLength 12M
MaxFileSize 10M
MaxScanSize 25M
MaxScanTime 45000
MaxRecursion 16
MaxFiles 1000
MaxEmbeddedPE 10M
MaxHTMLNormalize 10M
MaxScriptNormalize 10M
MaxZipTypeRcg 1M

# A limited or encrypted document is never a clean result.
AlertExceedsMax yes
AlertEncrypted yes
ReadTimeout 45
CommandReadTimeout 10
SendBufTimeout 45
